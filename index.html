<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador Visual de Fissuras</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%23c4c8cb'/%3E%3Cpath d='M19 3l-3 6 3 3-4 6 3 4-3 9' fill='none' stroke='%231d2a33' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Visual baseado na proposta feita no Canva: cartões brancos sobre cinza-claro, destaque azul-petróleo. */
  :root{
    --bg:#e9eaeb; --card:#ffffff; --ink:#2f3d4a; --muted:#7a858f; --line:#dde1e4;
    --accent:#0b5566; --accent-ink:#1f6a7d; --accent-hover:#0e6a7e; --accent-soft:#e3eff2;
    --warn:#b4472f; --chip:#eef2f3;
    --shadow:0 1px 2px rgba(20,35,45,.06),0 2px 8px rgba(20,35,45,.06);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{flex:none;min-height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;
    background:#fff;box-shadow:0 1px 0 var(--line),0 2px 6px rgba(20,35,45,.05);position:relative;z-index:2}
  header .logo{width:34px;height:34px;flex:none;border-radius:8px;box-shadow:var(--shadow)}
  header h1{font-size:17px;margin:0 0 0 2px;font-weight:600;letter-spacing:.1px;white-space:nowrap;flex:none}
  header .sub{color:var(--muted);font-size:12.5px}
  header .sp{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid #cdd2d6;background:#fff;color:var(--ink);
    border-radius:8px;padding:6px 12px;transition:background .12s,border-color .12s,color .12s}
  button:hover{border-color:#9fa9b1;background:#f7f9f9}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  button[disabled]{opacity:.5;cursor:default}
  button.danger{color:var(--warn);border-color:#e3c3bb}
  header button{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 1px rgba(20,35,45,.04)}
  .ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:1100px){ header .sub{display:none} }
  /* em telas estreitas, os botões do topo quebram em linhas em vez de sair da tela */
  @media (max-width:760px){
    header{flex-wrap:wrap;height:auto;padding:8px 10px;gap:6px}
    header h1{flex:1;font-size:15px}
    header .sp{display:none}
    header button{padding:5px 9px;font-size:13px}
    header button .ico{display:none}
  }

  /* área de trabalho: vista 3D e painel, como cartões */
  #app{position:relative;flex:1;min-height:0;display:flex;gap:14px;padding:14px}
  #viewport{position:relative;flex:1;min-width:0;background:#f4f5f5;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  #viewport canvas{display:block;width:100%;height:100%;outline:none}
  #tip{position:absolute;pointer-events:none;background:rgba(31,45,56,.92);color:#fff;
    font-size:12px;padding:3px 8px;border-radius:6px;transform:translate(12px,12px);display:none;white-space:nowrap}
  #toast{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;
    padding:5px 10px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12);transform:translate(14px,-34px);display:none;white-space:nowrap}
  #help{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;font-size:12.5px;color:#55616c;box-shadow:var(--shadow)}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--warn)}

  aside{width:360px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
  aside section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  aside h3{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink);font-weight:700}
  .selhead{display:flex;align-items:flex-end;gap:8px;margin-bottom:8px}
  .selhead .who{flex:1;min-width:0}
  .selhead h2{margin:0;font-size:28px;line-height:1.1;font-weight:700;color:var(--accent-ink);overflow-wrap:anywhere}
  .tag{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .x{border:none;background:none;font-size:20px;color:var(--muted);padding:0 4px;align-self:flex-start}
  dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 14px;font-size:13px}
  dt{color:var(--muted)} dd{margin:0}
  .actions{display:flex;flex-direction:column;gap:7px}
  .act{text-align:left;display:flex;align-items:center;gap:9px;padding:9px 12px;font-weight:500}
  .act .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #9aa4ac;flex:none}
  .act.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.on:hover{background:var(--accent-hover)}
  .act.on .dot{background:#fff;border-color:#fff}
  .act[disabled]{opacity:.55;cursor:default;background:#fff}
  .act .badge{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--chip);padding:1px 7px;border-radius:999px;font-weight:500}
  .act.on .badge{background:rgba(255,255,255,.18);color:#fff}
  .hint{color:var(--muted);font-size:13px;margin:0}
  .hint b{color:var(--ink)}
  .note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
  .toggle{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;background:#f7f9f9;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .chips{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .chip{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border-radius:999px;padding:6px 8px 6px 14px;font-size:13px;font-weight:500;max-width:100%}
  .chip span{flex:1;min-width:0} .chip small{color:rgba(255,255,255,.75);font-weight:400}
  .chip span br{display:none} .chip small::before{content:" · "}
  .chip button{border:none;padding:0 6px;font-size:16px;line-height:1;color:#fff;background:rgba(255,255,255,.16);border-radius:999px;height:22px}
  .chip button:hover{background:rgba(255,255,255,.3)}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row label{flex:1}
  .row input[type=range]{flex:1.4}
  input[type=range],input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
  input[type=checkbox],input[type=radio]{width:16px;height:16px}
  .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
  .checks label{display:flex;align-items:center;gap:9px;margin:6px 0}
  .checks label.dis{color:var(--muted)}
  .checks label small{color:var(--muted)}
  select{font:inherit;border:1px solid #cdd2d6;border-radius:8px;padding:4px 8px;background:#fff;color:var(--ink)}
  .legend{background:#fff;border-left:4px solid var(--accent);border-radius:4px 8px 8px 4px;padding:4px 0 4px 14px;margin-bottom:14px;font-size:13px}
  .legend:last-child{margin-bottom:0}
  .legend b{display:block;margin-bottom:6px;color:var(--accent-ink);font-size:15px;font-weight:600}
  .legend p{margin:0 0 8px;color:#55616c} .legend em{display:block;font-style:normal;color:var(--ink);font-weight:600;margin-bottom:1px}
  .empty{color:var(--muted);font-size:13px;margin:0}
  input[type=file]{display:none}

  /* modo de edição */
  #viewport #plan{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}
  #edbar{position:absolute;top:12px;left:12px;right:12px;display:none;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
  #edbar>*{pointer-events:auto}
  #edbar button{padding:4px 10px;font-size:12.5px}
  #edbar .seg{display:flex;box-shadow:var(--shadow);border-radius:8px}
  #edbar .seg button{border-radius:0} #edbar .seg button:first-child{border-radius:8px 0 0 8px} #edbar .seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
  #edbar .tools{display:flex;flex-wrap:wrap;gap:2px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
  #edbar .tools button{border-color:transparent;background:transparent}
  #edbar .tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #edbar select{font-size:12.5px;padding:4px 8px;box-shadow:var(--shadow)}
  #edhint{position:absolute;left:14px;bottom:14px;right:14px;display:none;background:rgba(255,255,255,.94);border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted);width:max-content;max-width:calc(100% - 28px);box-shadow:var(--shadow)}
  #edhint.flash{color:var(--warn);border-color:#e3c3bb}
  body.editing #edbar{display:flex} body.editing #edhint{display:block} body.editing #help{display:none}
  body.editing.planta #viewport #plan{display:block}
  body.editing .sim-only{display:none} body:not(.editing) .edit-only{display:none}
  .form{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;font-size:13px;margin-bottom:12px}
  .form span{color:var(--muted)}
  .form input,.form select{font:inherit;width:100%;min-width:0;border:1px solid #cdd2d6;border-radius:8px;padding:4px 8px;background:#fff}
  .btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px} .btnrow button{font-size:12.5px;padding:5px 10px}
  .oplist{display:flex;flex-direction:column;gap:4px;margin-bottom:4px} .oplist button{text-align:left;font-size:12.5px;padding:5px 10px}

  @media (max-width:760px){
    #app{flex-direction:column;padding:10px;gap:10px}
    #viewport{flex:none;height:52%}
    aside{width:auto;flex:1;min-height:0}
  }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dcde"/><stop offset="1" stop-color="#a9aeb2"/></linearGradient></defs><rect width="34" height="34" rx="8" fill="url(#lg)"/><path d="M0 17.5h34M17 0v34" stroke="#c4c8cb" stroke-width="1"/><path d="M19 3l-3 6 3 3-4 6 3 4-3 9" fill="none" stroke="#1d2a33" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M16 18l-4 2" fill="none" stroke="#1d2a33" stroke-width="1.2" stroke-linecap="round"/></svg>
  <h1>Simulador Visual de Fissuras</h1>
  <span class="sub">Vistorias e treinamentos · visual, sem cálculo estrutural</span>
  <span class="sp"></span>
  <button id="bEdit" title="Desenhar ou alterar a estrutura (planta e 3D)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span>Editar modelo</span></button>
  <button id="bKnock" title="Ligado: clicar numa peça cerâmica toca o som da percussão e marca a peça"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6z"/><path d="M12.5 8.5L4 17l3 3 8.5-8.5"/></svg>Teste de percussão</button>
  <button id="bReset" class="primary" title="Remove todos os cenários aplicados"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Resetar cenários</button>
  <button id="bView" title="Volta a câmera para a vista inicial"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg>Vista inicial</button>
  <button id="bOpen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Abrir JSON</button>
  <button id="bSave"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Salvar JSON</button>
  <input type="file" id="fileIn" accept=".json,application/json">
</header>
<div id="app">
  <div id="viewport">
    <canvas id="plan"></canvas>
    <div id="edbar">
      <div class="seg"><button data-view="planta">Planta</button><button data-view="3d">3D</button></div>
      <select id="edLevel" title="Pavimento em edição"></select>
      <div class="tools">
        <button data-tool="select" title="Selecionar, mover e redimensionar (V)">Selecionar</button>
        <button data-tool="column" title="Inserir pilar (P)">Pilar</button>
        <button data-tool="beam" title="Desenhar viga (B)">Viga</button>
        <button data-tool="wall" title="Desenhar parede (W)">Parede</button>
        <button data-tool="slab" title="Desenhar laje (L)">Laje</button>
        <button data-tool="cantilever" title="Desenhar balanço (K)">Balanço</button>
        <button data-tool="piso" title="Desenhar piso cerâmico (F)">Piso</button>
        <button data-tool="porta" title="Inserir porta numa parede (D)">Porta</button>
        <button data-tool="janela" title="Inserir janela numa parede (J)">Janela</button>
        <button data-tool="delete" title="Apagar elemento (X)">Apagar</button>
      </div>
    </div>
    <div id="edhint"></div>
    <div id="tip"></div>
    <div id="toast"></div>
    <div id="help">Arraste para girar · botão direito para mover · roda para zoom · clique num elemento</div>
    <div id="err"></div>
  </div>
  <aside id="panel">
    <section id="editBox" class="edit-only"></section>
    <section id="selBox" class="sim-only"></section>
    <section class="sim-only"><h3>Cenários ativos</h3><div id="scenList"></div></section>
    <section class="sim-only">
      <h3>Controles</h3>
      <div class="row"><label for="rInt">Intensidade</label><input id="rInt" type="range" min="0" max="1" step="0.01" value="0.6"></div>
      <div class="scale"><span></span><span>leve&nbsp;&nbsp;·&nbsp;&nbsp;moderada&nbsp;&nbsp;·&nbsp;&nbsp;severa</span></div>
      <div class="row"><label for="rExag">Exagero da deformada</label><input id="rExag" type="range" min="0" max="3" step="0.05" value="1"></div>
      <div class="scale"><span></span><span>0× ··················· 3×</span></div>
    </section>
    <section class="checks">
      <h3>Vínculos</h3>
      <label><input type="radio" name="vinc" value="hiperestatica" checked> Hiperestática <small>· ligações rígidas, vigas contínuas</small></label>
      <label><input type="radio" name="vinc" value="isostatica"> Isostática <small>· vigas biapoiadas, ligações articuladas</small></label>
      <p class="note" id="vincNote"></p>
    </section>
    <section class="checks">
      <h3>Camadas</h3>
      <label><input type="checkbox" id="cEst" checked> Estrutura (pilares, vigas, lajes)</label>
      <label><input type="checkbox" id="cAlv" checked> Alvenaria</label>
      <label><input type="checkbox" id="cReb" checked> Reboco</label>
      <label><input type="checkbox" id="cUmi"> Umidade / infiltração nas fissuras</label>
      <label><input type="checkbox" id="cCer" checked> Cerâmica <small>· piso e paredes revestidas</small></label>
    </section>
    <section class="checks">
      <h3>Corte</h3>
      <label><input type="checkbox" id="cCut"> Ativar plano de corte</label>
      <div class="row"><label for="sAxis">Direção</label>
        <select id="sAxis"><option value="z">Transversal (Z)</option><option value="x">Longitudinal (X)</option><option value="y">Horizontal (planta)</option></select></div>
      <div class="row"><label for="rCut">Posição</label><input id="rCut" type="range" min="0" max="1" step="0.005" value="0.5"></div>
    </section>
    <section class="sim-only"><h3>Legenda</h3><div id="legend"></div></section>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function distPointSeg(px, pz, x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1, l2 = dx * dx + dz * dz || 1e-9;
  const t = clamp(((px - x1) * dx + (pz - z1) * dz) / l2, 0, 1);
  return Math.hypot(px - x1 - t * dx, pz - z1 - t * dz);
}
const fmt = (x, d = 2) => x.toFixed(d).replace('.', ',');
const PI = Math.PI;

/* ---------- textos ---------- */
const TYPE_LABEL = { column: 'Pilar', beam: 'Viga', slab: 'Laje', cantilever: 'Balanço', wall: 'Alvenaria', floor: 'Piso' };
const SCEN = {
  recalque: {
    label: 'Recalque de fundação', targets: ['column'], action: 'Recalcar fundação',
    causa: 'Assentamento diferencial do solo sob a fundação deste pilar: solo compressível ou aterro mal compactado, variação de umidade, fundação subdimensionada, escavação ou rebaixamento de lençol vizinho.',
    config: 'Fissuras inclinadas (~45°) nos panos de alvenaria, subindo em direção ao apoio que recalcou. Concentram-se nos cantos das aberturas e costumam aparecer nos dois pavimentos.'
  },
  esmagamento: {
    label: 'Esmagamento de pilar', targets: ['column'], action: 'Comprimir até esmagar',
    causa: 'Compressão acima da resistência: sobrecarga, concreto de baixa resistência ou mal adensado, seção ou armadura insuficientes, estribos muito espaçados.',
    config: 'Feixe de fissuras verticais (paralelas à carga) no trecho mais solicitado, lascamento do concreto nas quinas e barras flambadas expostas. O pilar encurta e o que está acima desce, fissurando as alvenarias vizinhas.'
  },
  tracao: {
    label: 'Pilar tracionado', targets: ['column'], action: 'Tracionar (pilar pendurado)',
    causa: 'Inversão do caminho das cargas: a fundação perdeu apoio ou o pilar foi alterado no pavimento inferior, e ele passa a ficar "pendurado" nas vigas superiores, trabalhando à tração em vez de compressão.',
    config: 'Fissuras horizontais, aproximadamente paralelas e regularmente espaçadas, atravessando toda a seção e contornando as quatro faces; pode surgir separação entre pilar e fundação.'
  },
  corrosao: {
    label: 'Corrosão de armadura', targets: ['column', 'beam'], action: 'Corrosão de armadura',
    causa: 'Perda da proteção do aço: cobrimento insuficiente, concreto poroso ou fissurado, carbonatação ou cloretos (umidade, maresia). O óxido ocupa mais volume que o aço e rompe o cobrimento.',
    config: 'Fissuras paralelas às barras (longitudinais na face inferior das vigas, verticais nas quinas dos pilares), manchas de ferrugem e desplacamento do cobrimento com armadura exposta.'
  },
  flexao: {
    label: 'Flexão em viga', targets: ['beam'], action: 'Flexão (sobrecarga)',
    causa: 'Carga acima da prevista, armadura de flexão insuficiente ou mal posicionada, vão excessivo ou retirada precoce do escoramento.',
    config: 'Fissuras verticais no meio do vão, partindo da face tracionada (inferior) e fechando em direção à linha neutra; acompanhadas de flecha visível. Em vigas contínuas surgem também fissuras na face superior junto aos apoios.'
  },
  cisalhamento: {
    label: 'Cisalhamento em viga', targets: ['beam'], action: 'Cisalhamento (esforço cortante)',
    causa: 'Esforço cortante acima da capacidade: estribos insuficientes ou mal ancorados, carga concentrada próxima ao apoio, concreto de baixa resistência.',
    config: 'Fissuras inclinadas (~45°) junto aos apoios, subindo da face inferior em direção ao pilar. Ruptura frágil: requer atenção imediata.'
  },
  torcao: {

/* ---------- geometria de painel (caixa subdividida, com aberturas) ---------- */
// Coordenadas locais: u ao longo do comprimento L, v ao longo da altura H, w na espessura T.
// Faces: 0 frente (+w), 1 fundo (-w), 2 lado u=0, 3 lado u=L, 4 base v=0, 5 topo v=H.
// Layout da textura:
//   'shared' – todas as faces usam a mesma imagem (alvenaria: fissura passante aparece nos dois lados);
//   'two'    – metade de cima da imagem para a face 0, metade de baixo para a face 1 (vigas, lajes);
//   'four'   – quatro faixas verticais, uma por face lateral (pilares).
function panelGeometry(L, H, T, openings, cell, layout) {
  const brk = (len, extra) => {
    const a = [0, len];
    for (let x = cell; x < len - 1e-4; x += cell) a.push(x);
    for (const x of extra) if (x > 0 && x < len) a.push(x);
    a.sort((p, q) => p - q);
    const r = [a[0]];
    for (const x of a) if (x - r[r.length - 1] > 1e-3) r.push(x);
    r[r.length - 1] = len;
    return r;
  };
  const us = brk(L, openings.flatMap(o => [o.u0, o.u1]));
  const vs = brk(H, openings.flatMap(o => [o.v0, o.v1]));
  const nu = us.length - 1, nv = vs.length - 1;
  const solid = new Uint8Array(nu * nv);
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const uc = (us[i] + us[i + 1]) / 2, vc = (vs[j] + vs[j + 1]) / 2;
    solid[j * nu + i] = openings.some(o => uc > o.u0 && uc < o.u1 && vc > o.v0 && vc < o.v1) ? 0 : 1;
  }
  const S = (i, j) => i >= 0 && j >= 0 && i < nu && j < nv && solid[j * nu + i] === 1;
  const h = T / 2;
  const uvf = (f, u, v, w) => {
    if (layout === 'two') {
      if (f === 1) return [u / L, 0.5 * v / H];
      if (f === 4) return [u / L, 0.501];
      return [u / L, 0.5 + 0.5 * v / H];
    }
    if (layout === 'four') {
      if (f === 0) return [0.25 * (u / L), v / H];
      if (f === 3) return [0.25 * (1 + (h - w) / T), v / H];
      if (f === 1) return [0.25 * (2 + (L - u) / L), v / H];
      if (f === 2) return [0.25 * (3 + (w + h) / T), v / H];
      return [0.01, v / H];
    }
    return [u / L, v / H];
  };
  const P = [], N = [], UV = [], I = [];
  const quad = (pts, n, f) => {
    const k = P.length / 3;
    for (const p of pts) { P.push(p[0], p[1], p[2]); N.push(n[0], n[1], n[2]); UV.push(...uvf(f, p[0], p[1], p[2])); }
    I.push(k, k + 1, k + 2, k, k + 2, k + 3);
  };
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    if (!S(i, j)) continue;
    const u0 = us[i], u1 = us[i + 1], v0 = vs[j], v1 = vs[j + 1];
    quad([[u0, v0, h], [u1, v0, h], [u1, v1, h], [u0, v1, h]], [0, 0, 1], 0);
    quad([[u1, v0, -h], [u0, v0, -h], [u0, v1, -h], [u1, v1, -h]], [0, 0, -1], 1);
    if (!S(i - 1, j)) quad([[u0, v0, -h], [u0, v0, h], [u0, v1, h], [u0, v1, -h]], [-1, 0, 0], 2);
    if (!S(i + 1, j)) quad([[u1, v0, h], [u1, v0, -h], [u1, v1, -h], [u1, v1, h]], [1, 0, 0], 3);
    if (!S(i, j - 1)) quad([[u0, v0, -h], [u1, v0, -h], [u1, v0, h], [u0, v0, h]], [0, -1, 0], 4);
    if (!S(i, j + 1)) quad([[u0, v1, h], [u1, v1, h], [u1, v1, -h], [u0, v1, -h]], [0, 1, 0], 5);
  }
  return { P, N, UV, I };
}

function buildMesh(spec, material, layout = 'shared') {
  const { origin: O, U, V } = spec;
  const W = new THREE.Vector3().crossVectors(U, V).normalize();
  const g = panelGeometry(spec.L, spec.H, spec.T, spec.openings || [], spec.cell || 0.25, layout);
  const n = g.P.length / 3, pos = new Float32Array(n * 3), nrm = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = g.P[3 * i], b = g.P[3 * i + 1], c = g.P[3 * i + 2];
    pos[3 * i] = O.x + U.x * a + V.x * b + W.x * c;
    pos[3 * i + 1] = O.y + U.y * a + V.y * b + W.y * c;
    pos[3 * i + 2] = O.z + U.z * a + V.z * b + W.z * c;
    const p = g.N[3 * i], q = g.N[3 * i + 1], r = g.N[3 * i + 2];
    nrm[3 * i] = U.x * p + V.x * q + W.x * r;
    nrm[3 * i + 1] = U.y * p + V.y * q + W.y * r;
    nrm[3 * i + 2] = U.z * p + V.z * q + W.z * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(g.UV, 2));
  geo.setIndex(g.I);
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.base = pos.slice();
  return mesh;
}

/* ---------- texturas de superfície (canvas) ---------- */
function speckle(ctx, w, h, color, rng, amount = 1) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, w, h);
  const n = Math.round(w * h / 45 * amount);
  for (let i = 0; i < n; i++) {
    const d = rng() < 0.5;
    ctx.fillStyle = d ? `rgba(0,0,0,${0.03 + rng() * 0.05})` : `rgba(255,255,255,${0.04 + rng() * 0.07})`;
    const s = 1 + rng() * 1.6;
    ctx.fillRect(rng() * w, rng() * h, s, s);
  }
}
function paintBlocks(ctx, w, h, L, H, rng) {
  const sx = w / L, sy = h / H;
  ctx.fillStyle = '#b9b2a6'; ctx.fillRect(0, 0, w, h);
  const BW = 0.4, RH = 0.2, J = 0.01;
  for (let k = 0; k * RH < H; k++) {
    const off = (k % 2) * 0.2;
    for (let u = -off; u < L; u += BW) {
      const t = rng();
      ctx.fillStyle = `hsl(${14 + t * 8},${42 + t * 10}%,${46 + rng() * 9}%)`;
      const x0 = Math.max(0, u + J / 2), x1 = Math.min(L, u + BW - J / 2);
      if (x1 <= x0) continue;
      const v0 = k * RH + J / 2, v1 = Math.min(H, (k + 1) * RH - J / 2);
      ctx.fillRect(x0 * sx, h - v1 * sy, (x1 - x0) * sx, (v1 - v0) * sy);
    }
  }
  const n = Math.round(w * h / 60);
  for (let i = 0; i < n; i++) { ctx.fillStyle = `rgba(0,0,0,${rng() * 0.06})`; ctx.fillRect(rng() * w, rng() * h, 1.5, 1.5); }
}
// Peças cerâmicas: porcelanato 60×60 no piso, azulejo 30×40 nas paredes revestidas.
const TILE = { floor: [0.6, 0.6], wall: [0.3, 0.4] };
const TILE_PAL = { floor: { h: 38, s: 18, l: 80, v: 6, grout: '#a49d90' }, wall: { h: 190, s: 8, l: 91, v: 3, grout: '#bfc4c4' } };
function paintTiles(ctx, r, L, H, type, rng, cutouts = []) {
  const [tw, th] = TILE[type], pal = TILE_PAL[type], sx = r.w / L, sy = r.h / H;
  const g = Math.max(0.003, 0.6 / sx);
  ctx.fillStyle = pal.grout; ctx.fillRect(r.x, r.y, r.w, r.h);

  const blot = (u, v, ru, rv, a) => {
    ctx.save();

    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, ru * sx);
    g.addColorStop(0, `rgba(78,84,74,${a})`); g.addColorStop(0.6, `rgba(92,96,84,${a * 0.5})`); g.addColorStop(1, 'rgba(92,96,84,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, ru * sx, 0, 2 * PI); ctx.fill();
    ctx.restore();
  };
  const m = Math.floor(f * (c.pts.length - 1)), a = 0.3 * f;
  let low = c.pts[0];
  for (let i = 0; i <= m; i += 8) {
    const p = c.pts[i];
    blot(p[0], p[1] - 0.05, 0.13, 0.17, a);
    if (p[1] < low[1]) low = p;
  }
  blot(low[0], Math.max(0.15, low[1] - 0.3), 0.2, 0.42, a * 1.1);

/* ---------- indicadores (setas de carga, recalque, movimentação) ---------- */
function arrow(from, dir, len, color) {
  const a = new THREE.ArrowHelper(dir.clone().normalize(), from, len, color, Math.min(0.22, len * 0.4), 0.12);
  for (const m of [a.line.material, a.cone.material]) { m.depthTest = false; m.transparent = true; }
  a.renderOrder = 10; a.line.renderOrder = a.cone.renderOrder = 10;
  return a;
}
function rebuildIndicators() {
  indicators.clear();
  const down = V3(0, -1, 0), up = V3(0, 1, 0), red = 0xc0392b, orange = 0xd9822b, pd = state.model.pd;
  for (const s of state.scen) {
    const add = (p, d, l, c = red) => indicators.add(arrow(p, d, l, c));
    if (s.type === 'recalque') { const c = colMap.get(s.target); add(V3(c.x, -0.85, c.z), down, 0.7); }
    else if (s.type === 'esmagamento') { const c = colMap.get(s.target); add(V3(c.x, CRUSH_Y1 + 0.75, c.z), down, 0.6); add(V3(c.x, CRUSH_Y0 - 0.75, c.z), up, 0.6); }
    else if (s.type === 'tracao') { const c = colMap.get(s.target); add(V3(c.x, pd - 0.9, c.z), up, 0.6); add(V3(c.x, 0.9, c.z), down, 0.6); }
    else if (s.type === 'flexao' || s.type === 'cisalhamento') {
      const b = beamInfo.get(s.target), fr = s.type === 'flexao' ? [0.2, 0.35, 0.5, 0.65, 0.8] : [0.22, 0.78];
      for (const r of fr) add(V3(b.x1 + b.dx * b.Lc * r, b.ytop + 0.85, b.z1 + b.dz * b.Lc * r), down, 0.75);
    } else if (s.type === 'torcao') {
      const b = beamInfo.get(s.target), nx = b.dz, nz = -b.dx, ym = b.ytop - b.h / 2;
      for (const r of [0.2, 0.8]) {
        const x = b.x1 + b.dx * b.Lc * r, z = b.z1 + b.dz * b.Lc * r, sg = r < 0.5 ? 1 : -1;
        add(V3(x + nx * 0.3 * sg, ym + 0.45, z + nz * 0.3 * sg), down, 0.55);
        add(V3(x - nx * 0.3 * sg, ym - 0.45, z - nz * 0.3 * sg), up, 0.55);
      }
    } else if (s.type === 'balanco') {
      const c = cantInfo.get(s.target);
      for (const r of [0.2, 0.5, 0.8]) {
        const x = c.axis === 'z' ? c.x0 + (c.x1 - c.x0) * r : c.at + c.out * c.len * 0.9;
        const z = c.axis === 'z' ? c.at + c.out * c.len * 0.9 : c.z0 + (c.z1 - c.z0) * r;
        add(V3(x, c.ytop + 0.8, z), down, 0.7);
      }
    } else if (s.type === 'expansao' || s.type === 'retracao') {
      const b = bounds, y = s.level * pd + 0.15, cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2, out = s.type === 'expansao';
      for (const [x, z, d] of [[b.x0, cz, V3(-1, 0, 0)], [b.x1, cz, V3(1, 0, 0)], [cx, b.z0, V3(0, 0, -1)], [cx, b.z1, V3(0, 0, 1)]]) {
        const p = V3(x, y, z);
        if (out) add(p.addScaledVector(d, 0.15), d, 0.7, orange);
        else add(p.addScaledVector(d, 0.9), d.clone().negate(), 0.7, orange);
      }
    }
  }
}

/* ---------- camadas e corte ---------- */
function applyLayers() {
  const L = state.layers;
  for (const e of entries.values()) for (const m of e.meshes) {
    if (e.type === 'wall') m.visible = L.alvenaria;
    // sem a cerâmica, a argamassa colante fica à mostra (com os vazios do piso oco)
    else if (e.type === 'floor') m.visible = m.userData.part ? L.estrutura : L.ceramica;
    else m.visible = L.estrutura;
  }
}
function applyCut() {
  const c = state.cut, b = bounds;
  if (b) {
    if (c.axis === 'x') { const p = b.x0 - 0.5 + c.frac * (b.x1 - b.x0 + 1); cutPlane.set(V3(1, 0, 0), -p); }
    else if (c.axis === 'z') { const p = b.z0 - 1.5 + c.frac * (b.z1 - b.z0 + 2); cutPlane.set(V3(0, 0, 1), -p); }
    else { const p = 0.02 + c.frac * (b.y1 + 0.3); cutPlane.set(V3(0, -1, 0), p); }
  }
  for (const e of entries.values()) for (const m of e.materials) {
    const want = c.on ? [cutPlane] : [];
    if (m.clippingPlanes?.length !== want.length) { m.clippingPlanes = want; m.needsUpdate = true; }
  }
}

/* ---------- seleção e destaque ---------- */
function paintHighlight() {
  for (const e of entries.values()) {
    const sel = e.id === state.sel, hov = e.id === state.hover;
    for (const m of e.materials) {
      m.emissive.set(sel || hov ? 0x1f8aa0 : 0x000000);
      m.emissiveIntensity = sel ? 0.45 : hov ? 0.18 : 0;

}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickHit(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(root.children.filter(m => m.visible), false);
  for (const h of hits) if (!state.cut.on || cutPlane.distanceToPoint(h.point) >= 0) return h;
  return null;
}
const pick = ev => pickHit(ev)?.object.userData.id ?? null;
const toastEl = $('#toast');
let toastTimer = 0;
function toast(ev, text) {
  const r = vp.getBoundingClientRect();
  toastEl.textContent = text; toastEl.style.left = (ev.clientX - r.left) + 'px'; toastEl.style.top = (ev.clientY - r.top) + 'px';
  toastEl.style.display = 'block'; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.style.display = 'none', 1400);
}
// Clique em peça cerâmica com o teste de percussão ligado: toca o som e marca a peça.
function percuss(hit, ev) {
  const e = entries.get(hit.object.userData.id);
  const ok = e.type === 'floor' ? !hit.object.userData.part : e.type === 'wall' && !!e.data.ceramica && state.layers.ceramica;
  if (!ok) return false;
  const p = hit.point.clone().sub(e.frame.origin);
  const [i, j] = tileOf(e, p.dot(e.frame.U), p.dot(e.frame.V));
  const hollow = e.hollow?.has(`${i},${j}`);
  knock(hollow);
  state.marks.set(`${e.id}|${i}|${j}`, hollow ? 'cavo' : 'cheio');
  redraw(e);
  toast(ev, hollow ? 'Som cavo: vazio sob a peça' : 'Som cheio: peça aderida');
  return true;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downAt || ev.button !== 0) return;
  if (Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  const hit = pickHit(ev);
  if (ed.on) { edit3DClick(hit); return; }
  if (state.percussao && hit && percuss(hit, ev)) return;
  state.sel = hit ? hit.object.userData.id : null; paintHighlight(); renderPanel();
});
const tip = $('#tip');
renderer.domElement.addEventListener('pointermove', ev => {

/* ---------- cenários ---------- */
// Cenários de laje (expansão/retração) valem para o nível inteiro: um por nível.
const sameScen = (s, type, target) => s.type === type &&
  (SCEN[type].level ? s.level === entries.get(target).data.level : s.target === target);
function makeScen(type, target) {
  const s = { id: ++scenSeq, type, target, t: 0 };

}

const scenTargetLabel = s => {

function renderPanel() {

  } else {

  if (tool === 'porta' || tool === 'janela') {
    if (lv < 0) return flash('Portas e janelas ficam nas paredes: escolha um pavimento');
    const w = m.walls.find(w => w.level === lv && distPointSeg(x, z, w.x1, w.z1, w.x2, w.z2) <= w.t / 2 + 8 / ed.s);
    if (!w) return flash('Clique sobre uma parede deste pavimento');
    const { dx, dz } = segInfo(w);
    insertOpening(w, tool, (x - w.x1) * dx + (z - w.z1) * dz);
    return;
  }
  if (tool === 'wall' && lv < 0) return flash('Paredes ficam nos pavimentos: escolha Térreo ou outro pavimento');
  if ((tool === 'slab' || tool === 'cantilever') && lv < 0) return flash('Lajes ficam no teto de um pavimento: escolha um pavimento');
  if (tool === 'piso' && lv > 0) return flash('O piso cerâmico fica no térreo: escolha Térreo ou Baldrame');
  const a = snapXZ(x, z, tool === 'wall' || tool === 'beam');
  ed.drag = { type: tool === 'wall' || tool === 'beam' ? 'draw' : 'rect', a, b: a };
});
planCv.addEventListener('pointermove', ev => {
  const [px, py] = planXY(ev), [x, z] = toW(px, py), d = ed.drag;
  ed.cur = [x, z];
  if (!d) {
    ed.hover = ['select', 'delete', 'porta', 'janela'].includes(ed.tool) ? hitPlan(x, z) : null;
    planCv.style.cursor = ed.tool === 'select' ? (hitHandle(px, py) ? 'move' : ed.hover ? 'pointer' : 'default') : 'crosshair';
  } else if (d.type === 'pan') { ed.ox = d.ox + px - d.px; ed.oy = d.oy + py - d.py; }
  else if (d.type === 'draw') { let b = snapXZ(x, z, true); if (ev.shiftKey) b = ortho(d.a, b); d.b = b; }
  else if (d.type === 'rect') d.b = snapXZ(x, z);
  else if (d.type === 'move') moveSel(d, x, z);
  else if (d.type === 'handle') dragHandle(d, x, z, ev.shiftKey);
  updateHint(); drawPlan();
});
planCv.addEventListener('pointerup', () => {
  const d = ed.drag; ed.drag = null;
  if (!d) return;
  if (d.type === 'draw') finishDraw(d);
  else if (d.type === 'rect') finishRect(d);
  else if ((d.type === 'move' || d.type === 'handle') && d.moved) { pushUndo(d.snap); commit(); }
  else drawPlan();
  updateHint();
});
planCv.addEventListener('pointerleave', () => { ed.cur = null; ed.hover = null; updateHint(); drawPlan(); });

function moveSel(d, x, z) {
  const g = ed.snap, dx = r3(Math.round((x - d.x) / g) * g), dz = r3(Math.round((z - d.z) / g) * g);
  if (!dx && !dz && !d.moved) return;
  d.moved = true;
  const el = elOf(ed.sel), o = d.orig;
  switch (ed.sel.kind) {
    case 'column':
      el.x = r3(o.x + dx); el.z = r3(o.z + dz);
      for (const a of d.att) { a.el['x' + a.k] = r3(a.x + dx); a.el['z' + a.k] = r3(a.z + dz); }
      break;
    case 'wall': case 'beam':
      el.x1 = r3(o.x1 + dx); el.x2 = r3(o.x2 + dx); el.z1 = r3(o.z1 + dz); el.z2 = r3(o.z2 + dz);
      break;
    case 'slab': case 'piso':
      el.x0 = r3(o.x0 + dx); el.x1 = r3(o.x1 + dx); el.z0 = r3(o.z0 + dz); el.z1 = r3(o.z1 + dz);
      break;
    case 'opening': {
      const { dx: ux, dz: uz, len } = segInfo(el), op = el.openings[ed.sel.oi];
      const du = Math.round(((x - d.x) * ux + (z - d.z) * uz) / g) * g;
      op.pos = r3(clamp(o.openings[ed.sel.oi].pos + du, 0.1, len - op.width - 0.1));
      break;
    }
  }
}
function dragHandle(d, x, z, shift) {
  const el = elOf(ed.sel), h = d.h;
  if (h.k === 1 || h.k === 2) {
    let p = snapXZ(x, z, true, el);
    if (shift) p = ortho(h.k === 1 ? [el.x2, el.z2] : [el.x1, el.z1], p);
    el['x' + h.k] = p[0]; el['z' + h.k] = p[1];
  } else {
    const p = snapXZ(x, z);
    el[h.ax] = p[0]; el[h.az] = p[1];
  }
  d.moved = true;
}
function finishDraw(d) {
  const [x1, z1] = d.a, [x2, z2] = d.b;
  if (Math.hypot(x2 - x1, z2 - z1) < 0.2) return drawPlan();
  pushUndo();
  const m = M();
  if (ed.tool === 'wall') {
    const w = { id: newId(`A${ed.level}-`, 2), level: ed.level, x1, z1, x2, z2, t: 0.15, openings: [] };
    m.walls.push(w); ed.sel = { kind: 'wall', id: w.id };
  } else {
    const lvB = beamLevel(), b = { id: newId(`V${lvB}-`, 2), level: lvB, x1, z1, x2, z2, b: 0.15, h: lvB === 0 ? 0.3 : 0.4 };
    m.beams.push(b); ed.sel = { kind: 'beam', id: b.id };
  }
  commit();
}
function finishRect(d) {
  const r = { x0: Math.min(d.a[0], d.b[0]), x1: Math.max(d.a[0], d.b[0]), z0: Math.min(d.a[1], d.b[1]), z1: Math.max(d.a[1], d.b[1]) };
  if (r.x1 - r.x0 < 0.2 || r.z1 - r.z0 < 0.2) return drawPlan();
  pushUndo();
  const m = M();
  if (ed.tool === 'piso') { const p = { id: newId('PS-'), ...r }; m.pisos.push(p); ed.sel = { kind: 'piso', id: p.id }; }
  else {
    const lv = ed.level + 1, bal = ed.tool === 'cantilever';
    const sl = { id: newId(`${bal ? 'B' : 'L'}${lv}-`), level: lv, kind: bal ? 'balanco' : 'laje', ...r, t: 0.12 };
    m.slabs.push(sl); ed.sel = { kind: 'slab', id: sl.id };
  }
  commit();
}
function insertOpening(w, type, u) {
  const { len } = segInfo(w);
  const o = type === 'porta' ? { type: 'porta', width: 0.8, height: 2.1, sill: 0 } : { type: 'janela', width: 1.2, height: 1.0, sill: 1.1 };
  if (o.width > len - 0.3) return flash('A parede é curta demais para esta abertura');
  o.pos = r3(clamp(Math.round((u - o.width / 2) / ed.snap) * ed.snap, 0.15, len - o.width - 0.15));
  if ((w.openings || []).some(q => o.pos < q.pos + q.width + 0.1 && q.pos < o.pos + o.width + 0.1)) return flash('Já existe uma abertura nesse trecho da parede');
  pushUndo();
  (w.openings ||= []).push(o);
  ed.sel = { kind: 'opening', id: w.id, oi: w.openings.length - 1 };
  commit();
}
function removeSel(sel) {
  if (sel.kind === 'opening') elOf(sel).openings.splice(sel.oi, 1);
  else { const L = listOf(sel.kind); L.splice(L.findIndex(e => e.id === sel.id), 1); }
  ed.sel = ed.hover = null;
  commit();
}
function copyFloorBelow() {
  const m = M(), lv = ed.level;
  if (lv < 1) return;
  const has = m.walls.some(w => w.level === lv) || m.beams.some(b => b.level === lv + 1) || m.slabs.some(s => s.level === lv + 1);
  if (has && !confirm('Substituir as paredes, vigas e lajes deste pavimento pelas do pavimento de baixo?')) return;
  pushUndo();
  m.walls = m.walls.filter(w => w.level !== lv); m.beams = m.beams.filter(b => b.level !== lv + 1); m.slabs = m.slabs.filter(s => s.level !== lv + 1);
  const copy = o => JSON.parse(JSON.stringify(o));
  for (const w of m.walls.filter(w => w.level === lv - 1)) m.walls.push({ ...copy(w), id: newId(`A${lv}-`, 2), level: lv });
  for (const b of m.beams.filter(b => b.level === lv)) m.beams.push({ ...copy(b), id: newId(`V${lv + 1}-`, 2), level: lv + 1, h: Math.max(b.h, 0.4) });
  for (const s of m.slabs.filter(s => s.level === lv && s.kind !== 'balanco')) m.slabs.push({ ...copy(s), id: newId(`L${lv + 1}-`), level: lv + 1 });
  ed.sel = null; commit();
}

/* vista 3D durante a edição: clique seleciona (ou apaga, com a ferramenta Apagar) */
function edit3DClick(hit) {
  const sel = hit ? selFromEntry(hit.object.userData.id) : null;
  if (ed.tool === 'delete' && sel) { pushUndo(); removeSel(sel); return; }
  ed.sel = sel; afterSelect();
}

/* painel de propriedades */
function renderEditPanel() {
  if (!ed.on) return;
  const m = M(), sel = ed.sel, el = elOf(sel);
  const num = (k, v, step = 0.05, attr = 'data-f') => `<input type="number" ${attr}="${k}" value="${+(+v).toFixed(3)}" step="${step}">`;
  const opts = (k, from, to, lab, cur) => { let o = ''; for (let l = from; l <= to; l++) o += `<option value="${l}" ${cur === l ? 'selected' : ''}>${lab(l)}</option>`; return `<select data-f="${k}">${o}</select>`; };
  const coords = (a, b) => a.map(k => `<span>${k} (m)</span>${num(k, el[k])}`).join('') + (b || '');
  let h = `<h3>Modelo</h3><div class="form">
    <span>Nome</span><input data-m="name" value="${esc(m.name || '')}">
    <span>Pavimentos</span><input type="number" data-m="floors" min="1" max="6" step="1" value="${m.floors}">
    <span>Pé-direito (m)</span><input type="number" data-m="pd" min="2.2" max="5" step="0.05" value="${m.pd}">
    <span>Grade</span><select data-m="snap">${[0.05, 0.1, 0.2, 0.25, 0.5, 1].map(g => `<option value="${g}" ${g === ed.snap ? 'selected' : ''}>${fmt(g * 100, 0)} cm</option>`).join('')}</select>
  </div>
  <div class="btnrow"><button data-cmd="undo" ${ed.undo.length ? '' : 'disabled'}>Desfazer</button><button data-cmd="redo" ${ed.redo.length ? '' : 'disabled'}>Refazer</button>
    ${ed.level >= 1 ? '<button data-cmd="copy" title="Copia paredes, vigas e lajes do pavimento de baixo para este">Copiar pavimento de baixo</button>' : ''}</div>
  <div class="btnrow"><button data-cmd="blank">Novo em branco</button><button data-cmd="example">Carregar exemplo</button><button data-cmd="fit">Enquadrar planta</button></div>
  <h3>Selecionado</h3>`;
  if (!el) {
    h += `<p class="hint">Escolha uma ferramenta na barra sobre a planta e desenhe. Com <b>Selecionar</b>, clique num elemento para editar as medidas aqui, arraste para mover e use as alças para redimensionar. Botão direito arrasta a planta; a roda dá zoom.</p>`;
  } else {
    let f = '', title = el.id, tag = KIND_LABEL[sel.kind];
    switch (sel.kind) {
      case 'column':
        f = `<span>Centro x (m)</span>${num('x', el.x)}<span>Centro z (m)</span>${num('z', el.z)}<span>Seção em x (m)</span>${num('b', el.b)}<span>Seção em z (m)</span>${num('h', el.h)}`;
        break;
      case 'beam':
        f = `<span>Nível</span>${opts('level', 0, m.floors, l => l === 0 ? 'Baldrame' : `Teto do ${floorName(l - 1).toLowerCase()}`, el.level)}`
          + coords(['x1', 'z1', 'x2', 'z2']) + `<span>Largura b (m)</span>${num('b', el.b)}<span>Altura h (m)</span>${num('h', el.h)}`;
        break;
      case 'wall':
        f = `<span>Pavimento</span>${opts('level', 0, m.floors - 1, floorName, el.level)}` + coords(['x1', 'z1', 'x2', 'z2']) + `<span>Espessura (m)</span>${num('t', el.t, 0.01)}`
          + `<span>Tela / ferro-cabelo</span><input type="checkbox" data-b="tela" ${el.tela !== false ? 'checked' : ''} style="width:auto">`
          + `<span>Cerâmica</span><input type="checkbox" data-b="ceramica" ${el.ceramica ? 'checked' : ''} style="width:auto">`;
        break;
      case 'slab':
        tag = el.kind === 'balanco' ? 'Balanço' : 'Laje';
        f = `<span>Tipo</span><select data-f="kind"><option value="laje" ${el.kind !== 'balanco' ? 'selected' : ''}>Laje</option><option value="balanco" ${el.kind === 'balanco' ? 'selected' : ''}>Balanço</option></select>`
          + `<span>Nível</span>${opts('level', 1, m.floors, l => `Teto do ${floorName(l - 1).toLowerCase()} (${fmt(l * m.pd)} m)`, el.level)}`
          + coords(['x0', 'z0', 'x1', 'z1']) + `<span>Espessura (m)</span>${num('t', el.t, 0.01)}`;
        break;
      case 'piso':
        f = coords(['x0', 'z0', 'x1', 'z1']);
        break;
      case 'opening': {
        const o = el.openings[sel.oi];
        tag = o.type === 'porta' ? 'Porta' : 'Janela'; title = `em ${el.id}`;
        f = `<span>Tipo</span><select data-o="type"><option value="porta" ${o.type === 'porta' ? 'selected' : ''}>Porta</option><option value="janela" ${o.type === 'janela' ? 'selected' : ''}>Janela</option></select>`
          + `<span>Início (m)</span>${num('pos', o.pos, 0.05, 'data-o')}<span>Largura (m)</span>${num('width', o.width, 0.05, 'data-o')}<span>Altura (m)</span>${num('height', o.height, 0.05, 'data-o')}`
          + (o.type === 'janela' ? `<span>Peitoril (m)</span>${num('sill', o.sill, 0.05, 'data-o')}` : '');
        break;
      }
    }
    h += `<div class="selhead"><div class="who"><span class="tag">${tag}</span><h2>${esc(title)}</h2></div></div><div class="form">${f}</div>`;
    if (sel.kind === 'wall') {
      h += `<div class="oplist">${(el.openings || []).map((o, i) => `<button data-op="${i}">${o.type === 'porta' ? 'Porta' : 'Janela'} · ${fmt(o.width)} m, a ${fmt(o.pos)} m do início</button>`).join('')}</div>
        <div class="btnrow"><button data-cmd="addPorta">+ Porta</button><button data-cmd="addJanela">+ Janela</button></div>`;
    }
    h += `<div class="btnrow"><button class="danger" data-cmd="del">Apagar ${sel.kind === 'opening' ? 'abertura' : 'elemento'}</button></div>`;
  }
  $('#editBox').innerHTML = h;
}
$('#editBox').addEventListener('change', ev => {
  const t = ev.target, ds = t.dataset, m = M();
  if (ds.m) {
    if (ds.m === 'snap') { ed.snap = +t.value; drawPlan(); return; }
    if (ds.m !== 'name' && !isFinite(+t.value)) return renderEditPanel();
    pushUndo();
    m[ds.m] = ds.m === 'name' ? t.value : +t.value;
    if (ds.m === 'floors') {
      const n = clamp(Math.round(+t.value) || 1, 1, 6), lost = m.walls.some(w => w.level >= n) || m.slabs.some(s => s.level > n) || m.beams.some(b => b.level > n);
      if (lost && !confirm('Reduzir os pavimentos apaga paredes, vigas e lajes dos pavimentos removidos. Continuar?')) { ed.undo.pop(); return renderEditPanel(); }
      ed.level = Math.min(ed.level, n - 1);
    }
    commit(); syncLevels();
    return;
  }
  const el = elOf(ed.sel);
  if (!el) return;
  if (ds.b) { pushUndo(); el[ds.b] = t.checked; return commit(); }
  const v = ds.f === 'kind' || ds.o === 'type' ? t.value : +t.value;
  if (typeof v === 'number' && !isFinite(v)) return renderEditPanel();
  pushUndo();
  if (ds.f) {
    el[ds.f] = v;
    // ao trocar o nível, a planta passa a mostrar o pavimento do elemento
    if (ds.f === 'level') { ed.level = ed.sel.kind === 'wall' ? v : v - 1; syncLevels(); }
  }
  if (ds.o) { const o = el.openings[ed.sel.oi]; o[ds.o] = v; if (ds.o === 'type' && v === 'porta') { o.sill = 0; o.height = Math.max(o.height, 2.1); } }
  commit();
});
$('#editBox').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.op) { ed.sel = { kind: 'opening', id: ed.sel.id, oi: +b.dataset.op }; afterSelect(); return; }
  switch (b.dataset.cmd) {
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'copy': copyFloorBelow(); break;
    case 'fit': fitPlan(); drawPlan(); break;
    case 'del': if (ed.sel) { pushUndo(); removeSel(ed.sel); } break;
    case 'addPorta': case 'addJanela': { const w = elOf(ed.sel); insertOpening(w, b.dataset.cmd === 'addPorta' ? 'porta' : 'janela', segInfo(w).len / 2); break; }
    case 'blank': case 'example':
      if (!confirm(b.dataset.cmd === 'blank' ? 'Começar um modelo em branco? (dá para desfazer)' : 'Carregar o sobrado de exemplo? (dá para desfazer)')) return;
      pushUndo();
      state.model = b.dataset.cmd === 'blank'
        ? { name: 'Novo modelo', floors: 1, pd: 2.8, vinculo: 'hiperestatica', columns: [], beams: [], slabs: [], walls: [], pisos: [] }
        : exampleModel();
      ed.sel = null; ed.level = 0; commit(); syncLevels(); fitPlan(); drawPlan(); homeView();
      break;
  }
});

/* barra de ferramentas, troca de vista e entrada/saída do modo */
function syncLevels() {
  const m = M();
  let o = '<option value="-1">Baldrame (fundação)</option>';
  for (let l = 0; l < m.floors; l++) o += `<option value="${l}">${floorName(l)}</option>`;
  $('#edLevel').innerHTML = o; $('#edLevel').value = ed.level;
}
function setTool(t) {
  ed.tool = t;
  for (const b of document.querySelectorAll('#edbar [data-tool]')) b.classList.toggle('on', b.dataset.tool === t);
  updateHint();
}
function setView(v) {
  ed.view = v;
  document.body.classList.toggle('planta', ed.on && v === 'planta');
  for (const b of document.querySelectorAll('#edbar [data-view]')) b.classList.toggle('on', b.dataset.view === v);
  updateHint(); drawPlan();
}
function setEdit(on) {
  ed.on = on;
  document.body.classList.toggle('editing', on);
  $('#bEdit').classList.toggle('on', on);
  $('#bEdit span').textContent = on ? 'Concluir edição' : 'Editar modelo';
  $('#bKnock').disabled = $('#bReset').disabled = on;
  if (on) {
    if (state.percussao) $('#bKnock').click();
    state.scen = []; state.marks.clear(); regen(); needDeform = true;   // a edição parte do modelo sem cenários
    for (const e of entries.values()) if (hasCeramic(e)) redraw(e);
    ed.sel = ed.hover = null; ed.undo = []; ed.redo = []; ed.level = Math.min(ed.level, M().floors - 1);
    syncLevels(); setTool(ed.tool); setView(ed.view); fitPlan(); renderEditPanel(); drawPlan();
  } else {
    ed.drag = null; document.body.classList.remove('planta');
    state.sel = null; paintHighlight(); renderPanel();
  }
}
$('#bEdit').addEventListener('click', () => setEdit(!ed.on));
$('#edbar').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.tool) setTool(b.dataset.tool);
  if (b.dataset.view) setView(b.dataset.view);
});
$('#edLevel').addEventListener('change', ev => { ed.level = +ev.target.value; ed.sel = ed.hover = null; afterSelect(); });
addEventListener('keydown', ev => {
  if (!ed.on || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'y') { ev.preventDefault(); redo(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && ed.sel) { ev.preventDefault(); pushUndo(); removeSel(ed.sel); return; }
  if (ev.key === 'Escape') { ed.drag = null; ed.sel = null; afterSelect(); return; }
  if (KEYS[k]) setTool(KEYS[k]);
});

/* ---------- laço principal ---------- */
function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  drawPlan();
}
new ResizeObserver(resize).observe(vp);

let last = performance.now();
const DUR = 2.4;
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const moving = new Set();
  for (const s of state.scen) if (s.t < 1) { s.t = Math.min(1, s.t + dt / DUR); moving.add(s.id); }
  if (moving.size || needDeform) { applyDeformation(); needDeform = false; }
  if (moving.size) for (const id of crackedIds) {
    const e = entries.get(id);
    for (const sid of moving) if (e.scenIds.has(sid)) { redraw(e); break; }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

buildScene(exampleModel());
resize(); homeView(); renderPanel();
requestAnimationFrame(tick);
window.__sim = { state, entries, toggleScenario, camera, controls, redraw, applyDeformation, ed, toS, afterSelect };
</script>
</body>
